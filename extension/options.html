<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Options — Semantic Recall Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-dark: #0f1115;
      --bg-card: #16181d;
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      margin: 0; 
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-weight: 600;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-main);
    }

    .hint {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.02);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
    }

    /* Custom Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:focus + .slider {
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.3);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--glass-border);
    }

    button#save {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button#save:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    
    button#save:active {
      transform: translateY(0);
    }

    #status {
      font-size: 13px;
      color: #34d399; /* green */
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Configuration</h2>

    <div class="form-group">
      <label>API Base URL</label>
      <span class="hint">The URL where your Python FastAPI backend is running.</span>
      <input id="apiBase" type="text" placeholder="http://localhost:8000" />
    </div>

    <div class="form-group">
      <label>Denylist Sites (One per line)</label>
      <span class="hint">These websites will NEVER be indexed into your memory to protect your privacy.</span>
      <textarea id="denylist" placeholder="mail.google.com&#10;app.slack.com&#10;chatgpt.com"></textarea>
    </div>

    <div class="checkbox-group">
      <label class="switch">
        <input id="autoIndex" type="checkbox">
        <span class="slider"></span>
      </label>
      <label for="autoIndex">Enable background Auto-Indexing when visiting pages</label>
    </div>

    <div class="footer">
      <span id="status">Settings saved!</span>
      <button id="save">Save Changes</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
