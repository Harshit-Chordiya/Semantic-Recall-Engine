[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-recall-engine"
version = "0.1.0"
description = "Semantic Recall Engine. A powerful tool using AI-driven RAG and FAISS indexing for advanced context retrieval."
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Manjeet Kumar" },
  { name = "Harshit Chordiya" }
]
keywords = ["RAG", "FAISS", "Gemini", "Agent", "Semantic Recall Engine"]

dependencies = [
  "python-dotenv>=0.9.9",
  "faiss-cpu>=1.10.0",
  "markitdown[all]>=0.1.1",
  "mcp[cli]>=1.6.0",
  "pillow>=11.1.0",
  "rich>=14.0.0",
  "scipy>=1.15.2",
  "tqdm>=4.66.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "llama-index>=0.14.7",
  "llama-index-embeddings-google-genai>=0.3.1",
  "google-genai>=1.47.0",
]

[project.scripts]
# Run your engine main()
semantic-recall-engine = "semantic_recall_engine.agent:main"
# Run API if you expose `app` in http.py
semantic-recall-api = "uvicorn.run:main"

[project.optional-dependencies]
dev = ["ruff>=0.6.9", "black>=24.10.0", "mypy>=1.13.0", "pytest>=8.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["semantic_recall_engine"]